$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1
site:
  title: Complete 60 Days DevOps Course
  structure:
    - type: section
      key: section-course-content
      title: Course Content
      path: course-content
      default: true
      children:
        - type: space
          key: space-overview
          title: Course Overview
          path: overview
          default: true
          content:
            directory: .
        - type: space
          key: space-devops-linux-basics
          title: DevOps and Linux Basics
          path: devops-and-linux-basics
          content:
            directory: ./module-1_devops-and-linux-basic
        - type: space
          key: space-docker-fundamentals
          title: Docker Fundamentals
          path: docker-fundamentals
          content:
            directory: ./module-2_Docker
        - type: space
          key: space-cicd-jenkins
          title: CI/CD with Jenkins
          path: cicd-with-jenkins
          content:
            directory: ./module-3_Jenkins
        - type: space
          key: space-config-ansible
          title: Configuration Management with Ansible
          path: configuration-management-with-ansible
          content:
            directory: ./module-4_Ansible
        - type: space
          key: space-kubernetes-basics
          title: Kubernetes Basics
          path: kubernetes-basics
          content:
            directory: ./module-5_kubernetes
        - type: space
          key: space-aws-devops
          title: AWS Hands-on DevOps
          path: aws-hands-on-devops
          content:
            directory: ./module-6_AWS
        - type: space
          key: space-terraform
          title: Cloud Infrastructure with Terraform
          path: cloud-infrastructure-with-terraform
          content:
            directory: ./module-7_Terraform
        - type: space
          key: space-monitoring
          title: Monitoring
          path: monitoring
          content:
            directory: ./module-8_Monitoring
        - type: space
          key: space-python-devops
          title: Python for DevOps
          path: python-for-devops
          content:
            directory: ./module-9_Python
